name: app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  go_router: ^13.0.0
  fl_chart: ^0.71.0
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  http: ^1.2.2
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/Imagens/Logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/Imagens/Logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/Imagens/logo.png
    - assets/Imagens/google.png
    - assets/Imagens/facebook.png
